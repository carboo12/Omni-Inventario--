# Configuración recomendada de NGINX para Omni Inventario +
# Optimizado para carga instantánea en dispositivos móviles vía red local (LAN/Wi-Fi)

worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimización de envio de archivos en red local
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Buffers optimizados para respuestas rápidas en Wi-Fi
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Compresión GZIP Nativa en Servidor NGINX
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    upstream omni_app {
        server 127.0.0.1:9003;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Raíz de distribución si NGINX sirve estáticos directamente
        # root /var/www/omni-inventario/dist;

        # 1. Caché agresiva e inmutable para estáticos Next.js y Vite
        location ~* ^/(_next/static|assets)/ {
            proxy_pass http://omni_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 2. Service Worker y Manifest (Sin caché agresiva para permitir actualizaciones)
        location ~* \/(sw\.js|manifest\.json|manifest\.webmanifest)$ {
            proxy_pass http://omni_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header Cache-Control "no-cache, must-revalidate";
        }

        # 3. Proxy general para API y rutas SPA
        location / {
            proxy_pass http://omni_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
